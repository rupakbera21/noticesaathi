<svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft glow shadow for dark theme -->
    <filter id="glass-shadow-dark" x="0" y="0" width="28" height="28" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="0" stdDeviation="1" flood-color="#a78bfa" flood-opacity="0.4" />
    </filter>
    <!-- Translucent pale-lavender face gradient for dark theme -->
    <linearGradient id="face-grad-dark" x1="4" y1="3" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96" />
      <stop offset="45%" stop-color="#ddd6fe" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.78" />
    </linearGradient>
    <!-- Thick violet bevel gradient for dark theme -->
    <linearGradient id="bevel-grad-dark" x1="4" y1="22" x2="24" y2="17" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6d28d9" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
  </defs>

  <!-- Group with shadow -->
  <g filter="url(#glass-shadow-dark)">
    <!-- Base tailless arrow silhouette -->
    <path
      d="M 4 3 L 4 22.5 L 11 16 L 23.5 17.5 Z"
      fill="url(#face-grad-dark)"
      stroke="#7c3aed"
      stroke-width="1.1"
      stroke-linejoin="round"
    />

    <!-- Thick violet bevel along the lower diagonal edge -->
    <path
      d="M 4 22.5 L 11 16 L 23.5 17.5 L 20 15 L 11 13.5 L 4 18.5 Z"
      fill="url(#bevel-grad-dark)"
      opacity="0.9"
    />

    <!-- Fine near-white specular highlight along upper-left tip and right edge -->
    <path
      d="M 4 4.5 L 4 21 M 4.8 3.8 L 22.5 17"
      stroke="#ffffff"
      stroke-width="1"
      stroke-linecap="round"
      opacity="0.95"
    />

    <!-- Violet refractive accent near inner notch -->
    <path
      d="M 11 13.5 L 11 16 L 16 16.5 Z"
      fill="#c4b5fd"
      opacity="0.45"
    />
  </g>
</svg>
