<svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft glow shadow for dark theme -->
    <filter id="cursor-shadow-dark" x="-2" y="-2" width="32" height="32" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="0" stdDeviation="1" flood-color="#a78bfa" flood-opacity="0.35" />
    </filter>
    <!-- Lavender translucent glass gradient for dark theme -->
    <linearGradient id="glass-grad-dark" x1="0" y1="0" x2="18" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#ddd6fe" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <!-- Main arrow body with shadow -->
  <path
    d="M 1.5 1.5 L 1.5 21 L 6.5 16.5 L 10.5 25 L 13.5 23.5 L 9.5 15 L 16.5 15 Z"
    fill="url(#glass-grad-dark)"
    stroke="#7c3aed"
    stroke-width="1.2"
    stroke-linejoin="round"
    filter="url(#cursor-shadow-dark)"
  />

  <!-- Upper-left specular highlight -->
  <path
    d="M 1.5 2 L 1.5 19 M 2.5 2 L 15 14.5"
    stroke="#ffffff"
    stroke-width="1"
    stroke-linecap="round"
    opacity="0.95"
  />

  <!-- Violet glass refractive accent -->
  <path
    d="M 7 16 L 10.5 23.5 L 12.5 22.5 L 9 15 Z"
    fill="#c4b5fd"
    opacity="0.3"
  />
</svg>
