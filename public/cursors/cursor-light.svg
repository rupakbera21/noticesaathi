<svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft shadow -->
    <filter id="cursor-shadow-light" x="-2" y="-2" width="32" height="32" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1" flood-color="#1e1b4b" flood-opacity="0.25" />
    </filter>
    <!-- Lavender translucent glass gradient -->
    <linearGradient id="glass-grad-light" x1="0" y1="0" x2="18" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5f3ff" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#ede9fe" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0.82" />
    </linearGradient>
  </defs>

  <!-- Main arrow body with shadow -->
  <path
    d="M 1.5 1.5 L 1.5 21 L 6.5 16.5 L 10.5 25 L 13.5 23.5 L 9.5 15 L 16.5 15 Z"
    fill="url(#glass-grad-light)"
    stroke="#4338ca"
    stroke-width="1.2"
    stroke-linejoin="round"
    filter="url(#cursor-shadow-light)"
  />

  <!-- Upper-left specular highlight -->
  <path
    d="M 1.5 2 L 1.5 19 M 2.5 2 L 15 14.5"
    stroke="#ffffff"
    stroke-width="0.8"
    stroke-linecap="round"
    opacity="0.9"
  />

  <!-- Violet glass refractive accent -->
  <path
    d="M 7 16 L 10.5 23.5 L 12.5 22.5 L 9 15 Z"
    fill="#8b5cf6"
    opacity="0.25"
  />
</svg>
