<svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft shadow -->
    <filter id="glass-shadow-light" x="0" y="0" width="28" height="28" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1" flood-color="#1e1b4b" flood-opacity="0.28" />
    </filter>
    <!-- Translucent pale-lavender face gradient -->
    <linearGradient id="face-grad-light" x1="4" y1="3" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#ede9fe" stop-opacity="0.90" />
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0.82" />
    </linearGradient>
    <!-- Thick violet bevel gradient -->
    <linearGradient id="bevel-grad-light" x1="4" y1="22" x2="24" y2="17" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="50%" stop-color="#5b21b6" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
  </defs>

  <!-- Group with shadow -->
  <g filter="url(#glass-shadow-light)">
    <!-- Base tailless arrow silhouette -->
    <path
      d="M 4 3 L 4 22.5 L 11 16 L 23.5 17.5 Z"
      fill="url(#face-grad-light)"
      stroke="#4338ca"
      stroke-width="1.1"
      stroke-linejoin="round"
    />

    <!-- Thick violet bevel along the lower diagonal edge -->
    <path
      d="M 4 22.5 L 11 16 L 23.5 17.5 L 20 15 L 11 13.5 L 4 18.5 Z"
      fill="url(#bevel-grad-light)"
      opacity="0.85"
    />

    <!-- Fine near-white specular highlight along upper-left tip and right edge -->
    <path
      d="M 4 4.5 L 4 21 M 4.8 3.8 L 22.5 17"
      stroke="#ffffff"
      stroke-width="1"
      stroke-linecap="round"
      opacity="0.95"
    />

    <!-- Violet refractive accent near inner notch -->
    <path
      d="M 11 13.5 L 11 16 L 16 16.5 Z"
      fill="#8b5cf6"
      opacity="0.4"
    />
  </g>
</svg>
